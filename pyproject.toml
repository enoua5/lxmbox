# This is a *virtual* root: it declares the workspace and shared tooling but is not an installable package.
# Each component lives under packages/ with its own pyproject.toml.

[tool.uv.workspace]
members = ["packages/*"]

# Workspace-internal dependencies resolve to the local packages rather than PyPI.
[tool.uv.sources]
rnmmp-core = { workspace = true }
rnmmp-server = { workspace = true }
rnmmp-client = { workspace = true }
lxmbox-mailboxd = { workspace = true }
lxmbox-cli = { workspace = true }
lxmbox-qt = { workspace = true }
lxmbox-nomad = { workspace = true }
lxmbox-web = { workspace = true }

# Shared dev tools, installed into the workspace environment with `uv sync --all-packages`.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    # Require docstrings
    "D100", # module
    "D101", # public class
    "D102", # public method
    "D103", # public function
    "D104", # public package (__init__.py)
    "D105", # magic method
    "D106", # public nested class
    "D107", # __init__ method
]

[tool.ruff.lint.isort]
known-first-party = [
    "rnmmp_core",
    "rnmmp_server",
    "rnmmp_client",
    "lxmbox_mailboxd",
    "lxmbox_cli",
    "lxmbox_qt",
    "lxmbox_nomad",
    "lxmbox_web",
]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-ra --import-mode=importlib"

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "packages/rnmmp-core/src",
    "packages/rnmmp-core/tests",
    "packages/rnmmp-server/src",
]
mypy_path = [
    "packages/rnmmp-core/src",
    "packages/rnmmp-server/src",
    "packages/rnmmp-client/src",
    "packages/lxmbox-mailboxd/src",
    "packages/lxmbox-cli/src",
    "packages/lxmbox-qt/src",
    "packages/lxmbox-nomad/src",
    "packages/lxmbox-web/src",
]

[[tool.mypy.overrides]]
# Missing type stubs
# Remove if/when we have them
module = ["RNS.*", "LXMF.*", "nomadnet.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `umsgpack` doesn't have typing, unlike the standard `msgpack`
# but we decided to use it to match the implementation used in RNS and LXMF
# We provide a typed wrapper in rnmmp_core.msgpack anyway
module = ["umsgpack"]
ignore_missing_imports = true
