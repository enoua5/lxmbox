[project]
name = "lxmbox-mailboxd"
version = "0.0.0"
description = "The lxmbox mail daemon: rnmmp servers, LXMF destination, and the lxmbox.control API."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Enoua5" }]
dependencies = [
    "rnmmp",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lxmbox_mailboxd"]
