[project]
name = "lxmbox-qt"
version = "0.0.0"
description = "The lxmbox native desktop client, built with Qt (PySide6)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Enoua5" }]
dependencies = [
    "lxmbox-cli",
    "pyside6>=6.8",
]

[project.scripts]
lxmbox-desktop = "lxmbox_qt.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lxmbox_qt"]
