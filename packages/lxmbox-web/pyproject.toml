[project]
name = "lxmbox-web"
version = "0.0.0"
description = "lxmbox's Django PWA frontend"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Enoua5" }]
dependencies = [
    "lxmbox-mgmt",
    "django>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lxmbox_web"]
