[project]
name = "lxmbox-mgmt"
version = "0.0.0"
description = "lxmbox management library and the `lxmbox` CLI"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Enoua5" }]
dependencies = [
    "lxmbox-popr",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.scripts]
lxmbox = "lxmbox_mgmt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lxmbox_mgmt"]
