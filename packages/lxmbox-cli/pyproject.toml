[project]
name = "lxmbox-cli"
version = "0.0.0"
description = "The lxmbox CLI: a simple rnmmp + lxmbox client with a local cache."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Enoua5" }]
dependencies = [
    "rnmmp-client",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.scripts]
lxmbox = "lxmbox_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lxmbox_cli"]
